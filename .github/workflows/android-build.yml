name: Android APK Build & Self-Update Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: |
          npx prisma generate
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: 'file:./dev.db'
          JWT_SECRET: 'ci-secret-for-apk-build-32-chars-minimum'

      - name: Setup Capacitor Android
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android
          echo "android.enableJetifier=true" >> android/gradle.properties
          cat << 'EOF' >> android/app/build.gradle

          dependencies {
              modules {
                  module("org.jetbrains.kotlin:kotlin-stdlib-jdk7") {
                      replacedBy("org.jetbrains.kotlin:kotlin-stdlib", "inlined into kotlin-stdlib")
                  }
                  module("org.jetbrains.kotlin:kotlin-stdlib-jdk8") {
                      replacedBy("org.jetbrains.kotlin:kotlin-stdlib", "inlined into kotlin-stdlib")
                  }
              }
          }
          EOF

      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: familydrive-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release for Self-Update
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: FamilyDrive ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
